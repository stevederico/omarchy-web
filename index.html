<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Omarchy</title>
  <meta name="description" content="Beautiful, Fun & Opinionated Linux by DHH">
  <link rel="icon" href="favicon.png">
  <style>
    :root {
      --bg: #1a1b26;
      --storm: #24283b;
      --ink: #414868;
      --text: #c0caf5;
      --muted: #a9b1d6;
      --dim: #565f89;
      --blue: #7aa2f7;
      --green: #9ece6a;
      --cyan: #7dcfff;
      --aqua: #b4f9f8;
      --red: #f7768e;
      --wall: url(theme-tokyo-night-oled.webp);
      --bar: 34px;
      --gap: 8px;
    }
    html[data-theme="flexoki"] {
      --bg: #100f0f; --storm: #1c1b1a; --ink: #343331; --text: #cecdc3;
      --muted: #b7b5a9; --dim: #6f6e69; --blue: #da702c; --green: #879a39;
      --cyan: #3aa99f; --aqua: #d0d6b5; --red: #d14d41;
      --wall: url(theme-flexoki-dark.webp);
    }
    html[data-theme="evergarden"] {
      --bg: #1d2426; --storm: #232c2e; --ink: #3c4a4c; --text: #d9e4dc;
      --muted: #b5c4ba; --dim: #6b7f74; --blue: #7aa2a5; --green: #96c7a3;
      --cyan: #9dd6c3; --aqua: #d5f0e2; --red: #e07a7a;
      --wall: url(theme-evergarden.webp);
    }
    html[data-theme="rose"] {
      --bg: #232136; --storm: #2a273f; --ink: #44415a; --text: #e0def4;
      --muted: #c4c0e3; --dim: #6e6a86; --blue: #9ccfd8; --green: #c4a7e7;
      --cyan: #ea9a97; --aqua: #f6c177; --red: #eb6f92;
      --wall: url(theme-rose-pine-moon.webp);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace; }
    a { color: var(--blue); }
    a:hover { color: var(--aqua); }
    :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    .skip { position: absolute; left: -999px; }
    .skip:focus { left: 8px; top: 8px; z-index: 20; background: var(--green); color: var(--bg); padding: 6px 10px; }
    .bar {
      height: var(--bar); display: flex; align-items: center; gap: 10px;
      padding: 0 10px; position: relative; z-index: 5;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      border-bottom: 1px solid var(--ink); user-select: none;
    }
    .logo {
      background: none; border: 0; color: var(--cyan); font: inherit; font-weight: 700;
      letter-spacing: .12em; text-transform: lowercase; cursor: pointer; padding: 4px 6px;
    }
    .logo:hover { color: var(--aqua); }
    .ws { display: flex; gap: 2px; }
    .ws button {
      background: none; border: 0; color: var(--dim); font: inherit; min-width: 22px; height: 22px;
      cursor: pointer; border-radius: 4px;
    }
    .ws button[aria-current="true"], .ws button:hover { color: var(--bg); background: var(--blue); }
    .hint { color: var(--dim); margin-left: 8px; }
    .hint kbd { color: var(--cyan); font: inherit; }
    .clock { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
    .tray { display: flex; gap: 10px; color: var(--muted); }
    .tray span { opacity: .85; }
    #stage { position: absolute; inset: var(--bar) 0 0 0; overflow: auto; }
    #stage::before {
      content: ""; position: absolute; inset: 0; background: var(--wall) center/cover;
      opacity: .28; z-index: 0;
    }
    .win {
      position: absolute; top: 0; left: 0; contain: strict; overflow: hidden;
      background: var(--storm); border: 2px solid var(--ink); border-radius: 5px;
      will-change: transform; z-index: 1;
      transition: transform .12s cubic-bezier(.33,1,.68,1), width .12s cubic-bezier(.33,1,.68,1), height .12s cubic-bezier(.33,1,.68,1);
    }
    .win.on { border-color: var(--blue); z-index: 2; }
    .win.gone { visibility: hidden; pointer-events: none; content-visibility: hidden; }
    .pad { padding: 18px 18px 16px; height: 100%; overflow: auto; }
    .kicker { color: var(--green); letter-spacing: .12em; text-transform: uppercase; font-size: 11px; margin: 0 0 10px; }
    h1 { font-size: 22px; margin: 0; color: #fff; line-height: 1.2; }
    .by { color: var(--muted); margin: 8px 0 0; }
    .lede { margin: 14px 0 0; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 14px;
      border-radius: 6px; font: inherit; font-weight: 700; text-decoration: none; border: 1px solid transparent; cursor: pointer;
    }
    .btn-go { background: var(--green); color: var(--bg); }
    .btn-go:hover { background: var(--aqua); color: var(--bg); }
    .btn-ghost { background: none; color: var(--text); border-color: var(--ink); }
    .btn-ghost:hover { border-color: var(--blue); color: var(--cyan); }
    .sha { margin-top: 18px; color: var(--dim); font-size: 11px; }
    .sha code { display: block; color: var(--muted); word-break: break-all; margin-top: 4px; }
    .sha button { background: none; border: 0; color: var(--blue); font: inherit; cursor: pointer; padding: 0; }
    .term { height: 100%; margin: 0; padding: 14px 16px; white-space: pre-wrap; color: var(--text); }
    .term .p { color: var(--green); }
    .term .c { color: var(--cyan); }
    .blink { display: inline-block; width: 7px; height: 13px; background: var(--text); vertical-align: -1px; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .facade, .facade iframe { width: 100%; height: 100%; border: 0; display: block; }
    .facade { padding: 0; cursor: pointer; background: #000; position: relative; }
    .facade img { width: 100%; height: 100%; object-fit: cover; }
    .facade i { position: absolute; inset: 0; margin: auto; width: 58px; height: 40px; background: var(--red); border-radius: 10px; pointer-events: none; }
    .facade i::after { content: ""; position: absolute; left: 23px; top: 12px; border: 8px solid transparent; border-left: 14px solid #fff; }
    .shot { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px; }
    .chip {
      display: inline-flex; align-items: center; height: 34px; padding: 0 12px;
      border: 1px solid var(--ink); border-radius: 6px; color: var(--text); text-decoration: none; font-weight: 600;
    }
    .chip:hover { border-color: var(--blue); color: var(--cyan); }
    .menu[hidden], .keys[hidden] { display: none !important; }
    .menu, .keys {
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
      background: rgb(26 27 38 / .45); opacity: 0; pointer-events: none;
      transform: translate3d(0, 6px, 0); transition: opacity .12s, transform .12s;
    }
    .menu.open, .keys.open { opacity: 1; pointer-events: auto; transform: none; }
    .panel {
      width: min(420px, calc(100vw - 24px)); background: var(--storm); border: 1px solid var(--ink);
      border-radius: 8px; overflow: hidden; box-shadow: 0 18px 50px rgb(0 0 0 / .45);
    }
    #q {
      width: 100%; border: 0; border-bottom: 1px solid var(--ink); background: transparent;
      color: var(--text); font: inherit; padding: 12px 14px; outline: none;
    }
    #list { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow: auto; }
    #list li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 5px; cursor: pointer; }
    #list li[aria-selected="true"], #list li:hover { background: var(--ink); }
    #list .sub { color: var(--dim); }
    .keys .panel { padding: 16px 18px 18px; width: min(520px, calc(100vw - 24px)); }
    .keys h2 { margin: 0 0 10px; font-size: 14px; }
    .keys table { width: 100%; border-collapse: collapse; }
    .keys td { padding: 5px 0; vertical-align: top; }
    .keys td:first-child { color: var(--cyan); white-space: nowrap; padding-right: 16px; }
    @media (max-width: 720px) {
      .hint, .tray { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .win, .menu, .keys, .blink { transition: none; animation: none; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#stage">Skip To Content</a>
  <header class="bar">
    <button class="logo" id="logo" type="button" aria-haspopup="dialog" aria-controls="menu">omarchy</button>
    <div class="ws" role="tablist" aria-label="Workspaces">
      <button type="button" data-ws="0" aria-current="true">1</button>
      <button type="button" data-ws="1">2</button>
      <button type="button" data-ws="2">3</button>
      <button type="button" data-ws="3">4</button>
    </div>
    <span class="hint"><kbd>/</kbd> or <kbd>Ctrl+Space</kbd> menu</span>
    <div class="clock" id="clock"></div>
    <div class="tray" aria-hidden="true"><span>vol</span><span>wlan</span><span>100%</span></div>
  </header>
  <main id="stage"></main>
  <div class="menu" id="menu" role="dialog" aria-label="Omarchy menu" hidden>
    <div class="panel">
      <input id="q" placeholder="Search" autocomplete="off" spellcheck="false">
      <ul id="list"></ul>
    </div>
  </div>
  <div class="keys" id="keys" role="dialog" aria-label="Hotkeys" hidden>
    <div class="panel">
      <h2>Hotkeys</h2>
      <table>
        <tr><td>Super+Space / /</td><td>Omarchy menu</td></tr>
        <tr><td>Super+Return</td><td>Terminal</td></tr>
        <tr><td>Super+Shift+Return</td><td>Manual</td></tr>
        <tr><td>Super+J</td><td>Flip split</td></tr>
        <tr><td>Super+Arrow</td><td>Focus</td></tr>
        <tr><td>Super+W / Q</td><td>Close</td></tr>
        <tr><td>Super+F</td><td>Fullscreen</td></tr>
        <tr><td>Super+1..4</td><td>Workspace</td></tr>
        <tr><td>Super+K / Esc</td><td>This sheet / close</td></tr>
      </table>
    </div>
  </div>
  <script>
    const GAP = 8;
    const ISO = 'https://iso.omarchy.org/omarchy-4.0.1.iso';
    const SHA = '69cbb4e10d98ad831c3c9f245b5757a9d1fedfd0c9592780e977d6f950dea8c3';
    const stage = document.getElementById('stage');
    const listEl = document.getElementById('list');
    const qEl = document.getElementById('q');
    const menuEl = document.getElementById('menu');
    const keysEl = document.getElementById('keys');
    const clockEl = document.getElementById('clock');

    let idn = 1;
    const leaf = (app) => ({ t: 'l', id: idn++, app });
    const split = (dir, a, b, ratio) => ({ t: 's', dir, a, b, ratio: ratio || 0.5 });

    const html = {
      video: () => `<button class="facade" data-yt="F7fe9pa8OeE" aria-label="Play Omarchy Quattro"><img src="quattro.webp" alt="Omarchy Quattro" width="1280" height="720"><i></i></button>`,
      chuck: () => `<button class="facade" data-yt="9SDkU5VDQEQ" aria-label="Play NetworkChuck"><img src="networkchuck.webp" alt="NetworkChuck on Omarchy" width="1280" height="720" loading="lazy"><i></i></button>`,
      install: () => `<div class="pad"><p class="kicker">Quattro 4.0.1</p><h1>Beautiful, Fun &amp; Opinionated Linux</h1><p class="by">by <a href="https://dhh.dk">DHH</a></p><p class="lede">An omakase desktop on Arch, Hyprland, and Quickshell. Neovim to Spotify. Hell, even a Winamp-style player.</p><div class="row"><a class="btn btn-go" href="${ISO}">Download ISO</a><a class="btn btn-ghost" href="https://omarchy.org/manual/">Read The Manual</a></div><p class="sha">SHA256 <button type="button" id="copy-sha">Copy</button><code>${SHA}</code></p></div>`,
      term: () => `<pre class="term"><span class="p">sd@omarchy</span> <span class="c">~</span>\n<span class="p">❯</span> omarchy --version\nOmarchy 4.0.1 (Quattro)\n<span class="p">❯</span> <span class="c"># Super+Space for the menu</span>\n<span class="p">❯</span> <span class="blink"></span></pre>`,
      manual: () => `<div class="pad"><p class="kicker">Manual</p><h1>Welcome to Omarchy</h1><p class="lede">Omarchy is an omakase Linux distribution based on Arch, the tiling window manager Hyprland, and the desktop construction-kit Quickshell. It ships with everything a modern, savvy computer user needs to be productive immediately.</p><p class="lede">This is not a grab bag of packages. It is a complete system. A beautiful system is a motivating system.</p><div class="row"><a class="btn btn-go" href="https://omarchy.org/manual/">Open The Manual</a></div></div>`,
      more: () => `<div class="chips">
        <a class="chip" href="https://github.com/omacom/omarchy">GitHub</a>
        <a class="chip" href="https://omarchyplugins.com/">Plugins</a>
        <a class="chip" href="https://omarchy.org/news/">News</a>
        <a class="chip" href="https://discord.gg/tXFUdasqhY">Discord</a>
        <a class="chip" href="https://omarchy.org/meetups/">Meetups</a>
        <a class="chip" href="https://omarchy.org/teams/">Teams</a>
        <a class="chip" href="https://omarchy.org/patrons/">Patrons</a>
        <a class="chip" href="https://omarchy.org/workstations/">Workstations</a>
        <a class="chip" href="https://omarchy.org/security/">Security</a>
        <a class="chip" href="https://supply.37signals.com/collections/omarchy">Merch</a>
        <a class="chip" href="https://omarchy.org/air/">AIR</a>
        <a class="chip" href="https://omarchy.org/sponsorships/">Sponsorships</a>
      </div>`,
      tokyo: () => `<img class="shot" data-theme="tokyo" src="theme-tokyo-night-oled.webp" alt="Tokyo Night" width="1280" height="720" loading="lazy">`,
      flexoki: () => `<img class="shot" data-theme="flexoki" src="theme-flexoki-dark.webp" alt="Flexoki Dark" width="1280" height="720" loading="lazy">`,
      evergarden: () => `<img class="shot" data-theme="evergarden" src="theme-evergarden.webp" alt="Evergarden" width="1280" height="720" loading="lazy">`,
      rose: () => `<img class="shot" data-theme="rose" src="theme-rose-pine-moon.webp" alt="Rose Pine Moon" width="1280" height="720" loading="lazy">`
    };

    const MENU = [
      { label: 'Install', children: [{ label: 'Download ISO', act: 'iso' }] },
      { label: 'Style', children: [
        { label: 'Tokyo Night', act: 'theme', v: 'tokyo' },
        { label: 'Flexoki Dark', act: 'theme', v: 'flexoki' },
        { label: 'Evergarden', act: 'theme', v: 'evergarden' },
        { label: 'Rose Pine Moon', act: 'theme', v: 'rose' }
      ]},
      { label: 'Learn', children: [
        { label: 'Manual', act: 'url', v: 'https://omarchy.org/manual/' },
        { label: 'News', act: 'url', v: 'https://omarchy.org/news/' }
      ]},
      { label: 'Code', children: [
        { label: 'GitHub', act: 'url', v: 'https://github.com/omacom/omarchy' },
        { label: 'Plugins', act: 'url', v: 'https://omarchyplugins.com/' }
      ]},
      { label: 'Machine', children: [
        { label: 'Workstations', act: 'url', v: 'https://omarchy.org/workstations/' },
        { label: 'Security', act: 'url', v: 'https://omarchy.org/security/' }
      ]},
      { label: 'People', children: [
        { label: 'Discord', act: 'url', v: 'https://discord.gg/tXFUdasqhY' },
        { label: 'Meetups', act: 'url', v: 'https://omarchy.org/meetups/' },
        { label: 'Teams', act: 'url', v: 'https://omarchy.org/teams/' },
        { label: 'Patrons', act: 'url', v: 'https://omarchy.org/patrons/' },
        { label: 'AIR', act: 'url', v: 'https://omarchy.org/air/' },
        { label: 'Merch', act: 'url', v: 'https://supply.37signals.com/collections/omarchy' },
        { label: 'Sponsorships', act: 'url', v: 'https://omarchy.org/sponsorships/' }
      ]}
    ];

    const workspaces = [
      { tree: split('col', leaf('video'), split('row', leaf('term'), leaf('install'), 0.5), 0.58), focus: 0, wins: new Map(), full: false },
      { tree: split('col', split('row', leaf('tokyo'), leaf('flexoki')), split('row', leaf('evergarden'), leaf('rose')), 0.5), focus: 0, wins: new Map(), full: false },
      { tree: split('row', leaf('video'), leaf('chuck'), 0.5), focus: 0, wins: new Map(), full: false },
      { tree: split('row', leaf('manual'), leaf('more'), 0.58), focus: 0, wins: new Map(), full: false }
    ];
    let wi = 0;
    let raf = 0;
    let menuOpen = false;
    let keysOpen = false;
    let path = [];
    let filter = '';
    let sel = 0;

    function ws() { return workspaces[wi]; }

    function walk(n, fn) {
      if (n.t === 'l') fn(n);
      else { walk(n.a, fn); walk(n.b, fn); }
    }

    function findLeaf(n, id) {
      if (n.t === 'l') return n.id === id ? n : null;
      return findLeaf(n.a, id) || findLeaf(n.b, id);
    }

    function findApp(n, app) {
      if (n.t === 'l') return n.app === app ? n : null;
      return findApp(n.a, app) || findApp(n.b, app);
    }

    function parentOf(n, id, p) {
      if (n.t === 'l') return n.id === id ? p : null;
      return parentOf(n.a, id, n) || parentOf(n.b, id, n);
    }

    function replaceNode(root, target, next) {
      if (root === target) return next;
      if (root.t === 's') {
        root.a = replaceNode(root.a, target, next);
        root.b = replaceNode(root.b, target, next);
      }
      return root;
    }

    function layout(n, r, out) {
      if (n.t === 'l') { out.push({ id: n.id, app: n.app, r }); return; }
      if (n.dir === 'row') {
        const w = (r.w - GAP) * n.ratio;
        layout(n.a, { x: r.x, y: r.y, w, h: r.h }, out);
        layout(n.b, { x: r.x + w + GAP, y: r.y, w: r.w - w - GAP, h: r.h }, out);
      } else {
        const h = (r.h - GAP) * n.ratio;
        layout(n.a, { x: r.x, y: r.y, w: r.w, h }, out);
        layout(n.b, { x: r.x, y: r.y + h + GAP, w: r.w, h: r.h - h - GAP }, out);
      }
    }

    function mountLeaf(n, bag) {
      const el = document.createElement('section');
      el.className = 'win gone';
      el.dataset.id = String(n.id);
      el.innerHTML = (html[n.app] || html.more)();
      el.addEventListener('mousedown', () => { ws().focus = n.id; paint(); });
      stage.appendChild(el);
      bag.set(n.id, el);
    }

    function mountWs(w) {
      walk(w.tree, (n) => mountLeaf(n, w.wins));
      const first = [...w.wins.keys()][0];
      w.focus = first;
    }

    workspaces.forEach(mountWs);

    function paint() {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        const w = ws();
        const b = stage.getBoundingClientRect();
        const area = { x: GAP, y: GAP, w: b.width - GAP * 2, h: b.height - GAP * 2 };
        const boxes = [];
        if (w.full) {
          const n = findLeaf(w.tree, w.focus);
          if (n) boxes.push({ id: n.id, app: n.app, r: area });
        } else if (b.width < 720) {
          const leaves = [];
          walk(w.tree, (n) => leaves.push(n));
          const h = Math.max(b.height * 0.55, 260);
          leaves.forEach((n, i) => {
            boxes.push({ id: n.id, app: n.app, r: { x: GAP, y: GAP + i * (h + GAP), w: b.width - GAP * 2, h } });
          });
        } else layout(w.tree, area, boxes);
        workspaces.forEach((other, i) => {
          other.wins.forEach((el, id) => {
            const on = i === wi && boxes.some((x) => x.id === id);
            el.classList.toggle('gone', !on);
          });
        });
        boxes.forEach((box) => {
          const el = w.wins.get(box.id);
          el.style.transform = 'translate3d(' + box.r.x + 'px,' + box.r.y + 'px,0)';
          el.style.width = box.r.w + 'px';
          el.style.height = box.r.h + 'px';
          el.classList.toggle('on', box.id === w.focus);
        });
        document.querySelectorAll('.ws button').forEach((btn, i) => {
          btn.setAttribute('aria-current', i === wi ? 'true' : 'false');
        });
      });
    }

    function setWs(i) {
      wi = i;
      closeOverlays();
      paint();
    }

    function spawn(app) {
      const w = ws();
      const exists = findApp(w.tree, app);
      if (exists) { w.focus = exists.id; w.full = false; paint(); return; }
      const focused = findLeaf(w.tree, w.focus);
      const neu = leaf(app);
      mountLeaf(neu, w.wins);
      if (!focused) {
        w.tree = neu;
        w.focus = neu.id;
        paint();
        return;
      }
      const p = parentOf(w.tree, w.focus, null);
      const dir = p ? (p.dir === 'row' ? 'col' : 'row') : 'row';
      const s = split(dir, focused, neu, 0.5);
      if (!p) w.tree = s;
      else if (p.a === focused) p.a = s;
      else p.b = s;
      w.focus = neu.id;
      w.full = false;
      paint();
    }

    function closeFocused() {
      const w = ws();
      if (w.full) { w.full = false; paint(); return; }
      const p = parentOf(w.tree, w.focus, null);
      if (!p) return;
      const sib = (p.a.t === 'l' && p.a.id === w.focus) ? p.b : p.a;
      const el = w.wins.get(w.focus);
      if (el) el.remove();
      w.wins.delete(w.focus);
      w.tree = replaceNode(w.tree, p, sib);
      w.focus = sib.t === 'l' ? sib.id : (sib.a.t === 'l' ? sib.a.id : sib.b.id);
      paint();
    }

    function flip() {
      const w = ws();
      const p = parentOf(w.tree, w.focus, null);
      if (!p) return;
      p.dir = p.dir === 'row' ? 'col' : 'row';
      paint();
    }

    function focusDir(dx, dy) {
      const w = ws();
      const b = stage.getBoundingClientRect();
      const boxes = [];
      layout(w.tree, { x: GAP, y: GAP, w: b.width - GAP * 2, h: b.height - GAP * 2 }, boxes);
      const me = boxes.find((x) => x.id === w.focus);
      if (!me) return;
      const mx = me.r.x + me.r.w / 2;
      const my = me.r.y + me.r.h / 2;
      let best = null, bestD = Infinity;
      boxes.forEach((box) => {
        if (box.id === w.focus) return;
        const cx = box.r.x + box.r.w / 2 - mx;
        const cy = box.r.y + box.r.h / 2 - my;
        if (dx && cx * dx <= 4) return;
        if (dy && cy * dy <= 4) return;
        const d = Math.hypot(cx, cy);
        if (d < bestD) { bestD = d; best = box; }
      });
      if (best) { w.focus = best.id; paint(); }
    }

    function tick() {
      const d = new Date();
      const wd = d.toLocaleDateString('en-US', { weekday: 'short' });
      const tm = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
      clockEl.textContent = wd + ' ' + tm;
    }
    tick();
    setInterval(tick, 1000);

    function flatten(nodes, acc) {
      nodes.forEach((n) => {
        if (n.children) flatten(n.children, acc);
        else acc.push(n);
      });
      return acc;
    }

    function items() {
      if (filter) {
        const q = filter.toLowerCase();
        return flatten(MENU, []).filter((n) => n.label.toLowerCase().includes(q));
      }
      let cur = MENU;
      path.forEach((i) => { cur = cur[i].children; });
      return cur;
    }

    function drawMenu() {
      const rows = items();
      if (sel >= rows.length) sel = Math.max(0, rows.length - 1);
      listEl.replaceChildren();
      rows.forEach((n, i) => {
        const li = document.createElement('li');
        li.setAttribute('aria-selected', i === sel ? 'true' : 'false');
        li.innerHTML = '<span>' + n.label + '</span>' + (n.children ? '<span class="sub">›</span>' : '');
        li.addEventListener('mouseenter', () => {
          sel = i;
          [...listEl.children].forEach((el, j) => el.setAttribute('aria-selected', j === sel ? 'true' : 'false'));
        });
        li.addEventListener('click', (e) => { e.preventDefault(); run(n, i); });
        listEl.appendChild(li);
      });
    }

    function openMenu() {
      menuOpen = true;
      keysOpen = false;
      keysEl.classList.remove('open');
      filter = '';
      path = [];
      sel = 0;
      qEl.value = '';
      menuEl.hidden = false;
      menuEl.classList.add('open');
      drawMenu();
      qEl.focus();
    }

    function closeOverlays() {
      menuOpen = false;
      keysOpen = false;
      menuEl.classList.remove('open');
      keysEl.classList.remove('open');
      menuEl.hidden = true;
      keysEl.hidden = true;
    }

    function run(n, i) {
      if (n.children) { path.push(i); sel = 0; filter = ''; qEl.value = ''; drawMenu(); return; }
      closeOverlays();
      if (n.act === 'iso') location.href = ISO;
      else if (n.act === 'url') location.href = n.v;
      else if (n.act === 'theme') {
        if (n.v === 'tokyo') document.documentElement.removeAttribute('data-theme');
        else document.documentElement.setAttribute('data-theme', n.v);
        setWs(1);
      }
    }

    function playFacade(btn) {
      const id = btn.getAttribute('data-yt');
      const f = document.createElement('iframe');
      f.src = 'https://www.youtube.com/embed/' + id + '?autoplay=1';
      f.allow = 'autoplay; encrypted-media';
      f.allowFullscreen = true;
      btn.replaceWith(f);
    }

    document.getElementById('logo').addEventListener('click', openMenu);
    document.querySelector('.ws').addEventListener('click', (e) => {
      const b = e.target.closest('[data-ws]');
      if (b) setWs(Number(b.getAttribute('data-ws')));
    });
    stage.addEventListener('click', (e) => {
      const f = e.target.closest('.facade');
      if (f && f.hasAttribute('data-yt')) playFacade(f);
      const shot = e.target.closest('.shot');
      if (shot) {
        const t = shot.getAttribute('data-theme');
        if (t === 'tokyo') document.documentElement.removeAttribute('data-theme');
        else document.documentElement.setAttribute('data-theme', t);
      }
      if (e.target.id === 'copy-sha') navigator.clipboard.writeText(SHA);
    });
    menuEl.addEventListener('mousedown', (e) => { if (e.target === menuEl) closeOverlays(); });
    keysEl.addEventListener('mousedown', (e) => { if (e.target === keysEl) closeOverlays(); });
    qEl.addEventListener('input', () => { filter = qEl.value; sel = 0; drawMenu(); });

    function superKey(e) { return e.metaKey || e.ctrlKey; }

    window.addEventListener('keydown', (e) => {
      if (menuOpen) {
        const rows = items();
        if (e.key === 'Escape') {
          e.preventDefault();
          if (filter) { filter = ''; qEl.value = ''; sel = 0; drawMenu(); }
          else if (path.length) { path.pop(); sel = 0; drawMenu(); }
          else closeOverlays();
          return;
        }
        if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(rows.length - 1, sel + 1); drawMenu(); return; }
        if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); drawMenu(); return; }
        if (e.key === 'Enter' && rows[sel]) { e.preventDefault(); run(rows[sel], sel); return; }
        return;
      }
      if (keysOpen && e.key === 'Escape') { e.preventDefault(); closeOverlays(); return; }

      const s = superKey(e);
      if ((s && e.code === 'Space') || (e.key === '/' && e.target.tagName !== 'INPUT')) {
        e.preventDefault();
        openMenu();
        return;
      }
      if (s && e.code === 'KeyK') {
        e.preventDefault();
        keysOpen = !keysOpen;
        keysEl.hidden = !keysOpen;
        keysEl.classList.toggle('open', keysOpen);
        return;
      }
      if (e.key === 'Escape') { closeOverlays(); if (ws().full) { ws().full = false; paint(); } return; }
      if (!s) return;
      if (e.code === 'Enter' && e.shiftKey) { e.preventDefault(); spawn('manual'); }
      else if (e.code === 'Enter') { e.preventDefault(); spawn('term'); }
      else if (e.code === 'KeyJ') { e.preventDefault(); flip(); }
      else if (e.code === 'KeyW' || e.code === 'KeyQ') { e.preventDefault(); closeFocused(); }
      else if (e.code === 'KeyF') { e.preventDefault(); ws().full = !ws().full; paint(); }
      else if (e.code === 'Digit1') { e.preventDefault(); setWs(0); }
      else if (e.code === 'Digit2') { e.preventDefault(); setWs(1); }
      else if (e.code === 'Digit3') { e.preventDefault(); setWs(2); }
      else if (e.code === 'Digit4') { e.preventDefault(); setWs(3); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); focusDir(-1, 0); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); focusDir(1, 0); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); focusDir(0, -1); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); focusDir(0, 1); }
    });

    window.addEventListener('resize', paint);
    paint();
  </script>
</body>
</html>
